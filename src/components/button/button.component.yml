$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Button
status: experimental
description: A button, or a link styled as a button when `url` is set.
props:
  type: object
  required:
    - text
  properties:
    text:
      type: string
      title: Text
      description: Visible button label.
    url:
      type: string
      title: URL
      description: When set, renders an <a> element instead of a <button>.
    variant:
      type: string
      title: Variant
      enum:
        - primary
        - secondary
      default: primary
    button_type:
      type: string
      title: Button type
      description: The type attribute for <button> elements. Ignored for links.
      enum:
        - button
        - submit
        - reset
      default: button
